name: Tests

on:  
    pull_request:
    push:
        branches: [main]

jobs:
    test:
        strategy:
          fail-fast: false
          matrix:
            os: [ubuntu-latest, macos-latest]
            python-version: ['3.10', '3.11', '3.12']

        runs-on: ${{ matrix.os }} 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Upgrade pip 
      run: |
        python -m pip install --upgrade pip
        
    - name: Install Dependencies
      run: |
        pip install pytest numpy quanti-gin tequila-basic qulacs openfermion scipy pyscf

    - name: Run Tests
      run: |
        pytest tests/ -v
   